name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.6.9"
      - run: ruff format --check .

  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: addons
      - uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "17.0"
          path: odoo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev
      - name: Install Python dependencies
        run: |
          pip install -r odoo/requirements.txt
          pip install -r addons/requirements.txt
      - name: Run tests
        run: |
          python odoo/odoo-bin -d ci --db_host localhost --db_user odoo --db_password odoo \
            --addons-path=odoo/addons,addons -i rest_api_jwt --test-tags=/rest_api_jwt \
            --without-demo=all --stop-after-init --log-level=test 2>&1 | tee test.log
          grep -q "0 failed, 0 error(s)" test.log
